{{- if not .Values.runner.existingSecret -}}
# 为什么整份 config.toml 放进 Secret 而不是 ConfigMap：
# config.toml 里含 runner 的 authentication token（glrt-），把它放进
# ConfigMap 等于明文暴露在 `kubectl get cm -o yaml` 里。所以用 Secret。
# token 字段由 values.runner.token 提供，别提交到版本库。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gitlab-runner.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gitlab-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.toml: |
    concurrent = {{ .Values.runner.concurrent }}
    check_interval = {{ .Values.runner.checkInterval }}
    log_level = {{ .Values.runner.logLevel | quote }}
{{- if .Values.sessionServer.enabled }}

    [session_server]
      listen_address = "0.0.0.0:{{ .Values.sessionServer.port }}"
{{- if .Values.sessionServer.advertiseAddress }}
      advertise_address = {{ .Values.sessionServer.advertiseAddress | quote }}
{{- end }}
      session_timeout = {{ .Values.sessionServer.timeout }}
{{- end }}

    [[runners]]
      name = {{ .Values.runner.name | quote }}
      url = {{ .Values.gitlab.url | quote }}
      token = {{ .Values.runner.token | quote }}
      executor = "kubernetes"
      limit = {{ .Values.runner.concurrent }}
      request_concurrency = {{ .Values.runner.requestConcurrency }}
      tags = {{ .Values.runner.tags | quote }}
      run_untagged = {{ .Values.runner.runUntagged }}
      locked = {{ .Values.runner.locked }}
{{- with .Values.runner.environment }}
      environment = {{ . | toJson }}
{{- end }}
      [runners.kubernetes]
        namespace = {{ .Values.kubernetes.namespace | quote }}
        image = {{ .Values.kubernetes.image | quote }}
        privileged = {{ .Values.kubernetes.privileged }}
        pull_policy = [{{ .Values.kubernetes.pullPolicy | quote }}]
{{- if .Values.kubernetes.helperImage }}
        helper_image = {{ .Values.kubernetes.helperImage | quote }}
{{- end }}
{{- if .Values.kubernetes.serviceAccount }}
        service_account = {{ .Values.kubernetes.serviceAccount | quote }}
{{- end }}
{{- if .Values.kubernetes.cpuRequest }}
        cpu_request = {{ .Values.kubernetes.cpuRequest | quote }}
{{- end }}
{{- if .Values.kubernetes.memoryRequest }}
        memory_request = {{ .Values.kubernetes.memoryRequest | quote }}
{{- end }}
{{- if .Values.kubernetes.cpuLimit }}
        cpu_limit = {{ .Values.kubernetes.cpuLimit | quote }}
{{- end }}
{{- if .Values.kubernetes.memoryLimit }}
        memory_limit = {{ .Values.kubernetes.memoryLimit | quote }}
{{- end }}
{{- if .Values.kubernetes.imagePullSecrets }}
        image_pull_secrets = {{ .Values.kubernetes.imagePullSecrets | toJson }}
{{- end }}
{{- with .Values.kubernetes.nodeSelector }}

      [runners.kubernetes.node_selector]
{{- range $k, $v := . }}
        {{ $k | quote }} = {{ $v | quote }}
{{- end }}
{{- end }}
{{- with .Values.kubernetes.podSecurityContext }}

      [runners.kubernetes.pod_security_context]
{{- if hasKey . "runAsUser" }}
        run_as_user = {{ .runAsUser }}
{{- end }}
{{- if hasKey . "runAsGroup" }}
        run_as_group = {{ .runAsGroup }}
{{- end }}
{{- if hasKey . "runAsNonRoot" }}
        run_as_non_root = {{ .runAsNonRoot }}
{{- end }}
{{- if hasKey . "fsGroup" }}
        fs_group = {{ .fsGroup }}
{{- end }}
{{- with .seccompProfile }}

      [runners.kubernetes.pod_security_context.seccomp_profile]
        type = {{ .type | quote }}
{{- if .localhostProfile }}
        localhost_profile = {{ .localhostProfile | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- range .Values.kubernetes.secretVolumes }}

      [[runners.kubernetes.volumes.secret]]
        name = {{ .name | quote }}
        mount_path = {{ .mountPath | quote }}
        read_only = {{ if hasKey . "readOnly" }}{{ .readOnly }}{{ else }}true{{ end }}
{{- end }}
{{- range .Values.kubernetes.configMapVolumes }}

      [[runners.kubernetes.volumes.config_map]]
        name = {{ .name | quote }}
        mount_path = {{ .mountPath | quote }}
        read_only = {{ if hasKey . "readOnly" }}{{ .readOnly }}{{ else }}true{{ end }}
{{- end }}
{{- end }}
