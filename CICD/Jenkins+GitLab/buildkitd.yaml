# BuildKit 构建农场：rootless buildkitd 常驻（ns jenkins · devops-w1 · 端口 1234）
# 认证：harbor-push-config（key 必须是 config.json）挂 /home/user/.docker —— push 私有项目 + 拉 Harbor 私有基础镜像
# Harbor 无 TLS：buildkitd.toml [registry] http=true（管拉取/缓存导入导出）；推送产物在 buildctl output 加 registry.insecure=true
# rootless 三要素：rootless 镜像(UID 1000) + seccompProfile Unconfined（要建嵌套 user namespace）+ --oci-worker-no-process-sandbox
# 内核 6.8 → rootless overlayfs 原生可用，无需 fuse
apiVersion: v1
kind: ConfigMap
metadata:
  name: buildkitd-config
  namespace: jenkins
data:
  buildkitd.toml: |
    debug = false
    [registry."harbor.devops.local:32037"]
      http = true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buildkit-cache
  namespace: jenkins
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: buildkitd
  namespace: jenkins
  labels: { app: buildkitd }
spec:
  replicas: 1
  selector:
    matchLabels: { app: buildkitd }
  template:
    metadata:
      labels: { app: buildkitd }
      annotations:
        # containerd 2.x 起默认给容器套 AppArmor(cri-containerd.apparmor.d) 禁 mount 系统调用
        # → rootlesskit "failed to share mount point /: permission denied" 起不来，必须 unconfined
        container.apparmor.security.beta.kubernetes.io/buildkitd: unconfined
    spec:
      nodeSelector:
        kubernetes.io/hostname: devops-w1   # local PV 绑节点，与 Harbor 同机
      initContainers:
        - name: chown-cache                 # local-path 目录 root 属主，rootless(1000) 写不了
          image: busybox:1.36
          command: ["sh", "-c", "chown -R 1000:1000 /cache"]
          securityContext: { runAsUser: 0 }
          volumeMounts:
            - { name: cache, mountPath: /cache }
      containers:
        - name: buildkitd
          image: moby/buildkit:v0.33.0-rootless
          args:
            - --addr
            - tcp://0.0.0.0:1234
            - --config
            - /etc/buildkit/buildkitd.toml
            - --oci-worker-no-process-sandbox
          securityContext:
            seccompProfile: { type: Unconfined }
          readinessProbe:
            exec:
              command: ["buildctl", "--addr", "tcp://127.0.0.1:1234", "debug", "workers"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
          volumeMounts:
            - { name: cache, mountPath: /home/user/.local/share/buildkit }
            - { name: config, mountPath: /etc/buildkit }
            - { name: docker-auth, mountPath: /home/user/.docker }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: buildkit-cache }
        - name: config
          configMap: { name: buildkitd-config }
        - name: docker-auth
          secret: { secretName: harbor-push-config }
---
apiVersion: v1
kind: Service
metadata:
  name: buildkitd
  namespace: jenkins
spec:
  selector: { app: buildkitd }
  ports:
    - { port: 1234, targetPort: 1234 }
