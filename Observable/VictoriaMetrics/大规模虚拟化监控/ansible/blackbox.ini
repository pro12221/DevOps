# blackbox.ini — deploy-blackbox.yml 使用的 Ansible 清单
#
# 与 hosts.ini 的区别: 只包含拨测相关角色，供单独部署/更新 blackbox_exporter 时使用，
# 避免误触生产机上的 VM 存储组件。
# blackbox 集群 3 台（踩坑 #1 扩容方案）：bb1=10.86.11.94（与测试 vmagent 同机）、
# bb2=10.86.11.74、bb3=10.86.11.75。
# 各台监听 :9115，vmagent 的 6 个拨测 job（icmp/tcp × bb1-3）按 hashmod 分片分别调用 /probe。

# 角色组: 测试 vmagent（同机部署，拨测数据由它采集并 remote_write 到生产存储）
[vmagent_testing]
10.86.11.94

# 角色组: blackbox_exporter 拨测机（deploy-blackbox.yml 部署目标，bb1 与 vmagent 同机）
[blackbox_probe]
10.86.11.94
10.86.11.74
10.86.11.75

[vmagent_testing:vars]
ansible_ssh_user=root

[blackbox_probe:vars]
ansible_ssh_user=root
