# blackbox.ini — deploy-blackbox.yml 使用的 Ansible 清单
#
# 与 hosts.ini 的区别: 只包含拨测相关角色，供单独部署/更新 blackbox_exporter 时使用，
# 避免误触生产机上的 VM 存储组件。
# 拨测机与测试 vmagent 同机（10.86.11.94），blackbox_exporter 监听 :9115，
# 供 vmagent 的 blackbox-icmp / blackbox-tcp job 经 127.0.0.1:9115 调用 /probe。

# 角色组: 测试 vmagent（同机部署，拨测数据由它采集并 remote_write 到生产存储）
[vmagent_testing]
10.86.11.94

# 角色组: blackbox_exporter 拨测机（deploy-blackbox.yml 部署目标）
[blackbox_probe]
10.86.11.94

[vmagent_testing:vars]
ansible_ssh_user=root
