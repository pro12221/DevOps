# hosts.ini — deploy-vm.yml / deploy-host-exporters.yml 使用的 Ansible 清单
#
# 角色分工（deploy-vm.yml 按组名选择部署内容）:
#   生产拨测机 10.69.81.68: victoria-metrics(存储) + vmagent(生产抓取) + vmalert(规则) 三件套同机
#   测试拨测机 10.86.11.94: vmagent(测试抓取 + ICMP/TCP 拨测) + blackbox_exporter
#
# 环境划分依据 CMDB 的 IDC 前缀（TEST* = 测试），与下方 testing_idc_prefix 对应。

# 环境组（仅作参考分组，playbook 实际使用下面的角色组）
[production]
10.69.81.68

[testing]
10.86.11.94

# 角色组: VictoriaMetrics 单机存储（deploy-vm.yml 部署 :8428 TSDB）
[vm_storage]
10.69.81.68

# 角色组: 生产 vmagent（读 prometheus-production.yml，remote_write 到本机 127.0.0.1:8428）
[vmagent_production]
10.69.81.68

# 角色组: 测试 vmagent（读 prometheus-testing.yml，remote_write 跨机房到 10.69.81.68:8428）
[vmagent_testing]
10.86.11.94

# 角色组: vmalert 规则引擎（读 /etc/vmalert/rules/*.yml，:8880）
[vmalert]
10.69.81.68

# 角色组: blackbox_exporter 拨测机（deploy-blackbox.yml 部署 :9115）
[blackbox_probe]
10.86.11.94

# 将实际 KVM 宿主机分别加入以下环境组；监控组件主机不等于 exporter 目标主机。
[production_exporter_hosts]
10.69.81.68

[testing_exporter_hosts]
10.86.11.94

[libvirt_hosts:children]
production_exporter_hosts
testing_exporter_hosts

[all:vars]
# 全局 SSH 用户（监控机均以 root 直连）
ansible_ssh_user=root

# CMDB 中 IDC 以 TEST 开头的记录归入测试环境，其余非空 IDC 归入生产环境。
# 如前缀不同，可通过 ansible-playbook -e testing_idc_prefix=... 覆盖。
# testing_idc_prefix=TEST
