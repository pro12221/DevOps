# blackbox_exporter 配置
# 启动: ./blackbox_exporter --config.file=blackbox.yml   (默认监听 :9115)
#
# icmp 拨测需要 raw socket 权限:
#   setcap cap_net_raw+ep /data/bin/blackbox_exporter
#   或 systemd 中用 AmbientCapabilities=CAP_NET_RAW

modules:
  # ICMP 拨测（vmagent job=blackbox-icmp 调用）:
  # 对应 vmagent relabel 中 params.module=icmp，探测目标 IP 是否可 ping，
  # 产出 probe_success / probe_duration_seconds 等指标
  icmp:
    prober: icmp
    # 单次探测超时 5s（global scrape_timeout 为 10s，留出余量）
    timeout: 5s
    icmp:
      # 强制走 IPv4——虚机/宿主机均只有 IPv4 管理网地址
      preferred_ip_protocol: ip4

  # TCP 端口连通性拨测（vmagent job=blackbox-tcp 调用）:
  # 对应 vmagent relabel 中 params.module=tcp_connect，
  # Linux 目标探 22(SSH)、Windows 目标探 3389(RDP)
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: ip4
