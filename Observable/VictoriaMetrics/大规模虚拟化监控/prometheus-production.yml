# prometheus-production.yml — 生产环境 vmagent 抓取配置
#
# 用途: 生产拨测机上的 vmagent 使用此配置（deploy-vm.yml 按 vmagent_role 选择本文件或 prometheus-testing.yml）。
#
# 采集范围（生产环境只挂 node_exporter + libvirt_exporter，拨测由测试机承担）:
#   1. node-exporter  : 所有生产 KVM 宿主机(:9100)，采宿主机自身 CPU/内存/磁盘/网卡
#   2. libvirt-vm     : 所有生产 KVM 宿主机(:9177)，采每台虚机(domain)的 CPU/内存/网卡/磁盘
#   3. self-monitoring: 拨测机本机的 VM 三件套(vmagent/vmalert/victoria-metrics)，用于组件自监控
#
# file_sd 文件由 cmdb-sd.py（cron 每 10 分钟）生成到 /data/targets/：
#   production-node.json    → 宿主机目标（端口 9100）
#   production-libvirt.json → 宿主机目标（端口 9177）
#
# 数据流向: vmagent 抓取 → remote_write 到 127.0.0.1:8428（同机 VictoriaMetrics，单机版）

global:
  # 全局默认抓取间隔/超时（30s 间隔下，单机版 VM 面对多目标仍绰绰有余）
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # ============ 生产宿主机 node_exporter ============
  # targets 为宿主机 IP，实例以宿主机 IP 展示，与 libvirt-vm/blackbox 对齐
  - job_name: node-exporter
    file_sd_configs:
      - files: [/data/targets/production-node.json]
    relabel_configs:
      # instance 标签显示宿主机真实 IP，而不是 IP:9100
      - source_labels: [__address__]
        target_label: instance
      # file_sd 是裸 IP，补上 node_exporter 端口（此前漏了这步，实际抓的一直是 80 端口，
      # up 全 0、宿主机资源面板无数据）
      - source_labels: [__address__]
        target_label: __address__
        regex: (.*)
        replacement: ${1}:9100
      # 打上环境标签，Grafana 按环境区分；scrape_source 标记数据由哪台 vmagent 采集
      - target_label: environment
        replacement: production
      - target_label: scrape_source
        replacement: production

  # ============ 生产宿主机 libvirt_exporter（虚机指标） ============
  # targets 同样是宿主机 IP，端口改写为 :9177；host_ip 标签保留宿主机 IP，
  # 让虚机指标既能按虚机(vm_ip/domain)也能按宿主机(host_ip)聚合
  - job_name: libvirt-vm
    file_sd_configs:
      - files: [/data/targets/production-libvirt.json]
    relabel_configs:
      # 实际抓取地址 = 宿主机 IP + :9177（libvirt_exporter 端口）
      - source_labels: [__address__]
        target_label: __address__
        regex: (.*)
        replacement: ${1}:9177
      # host_ip 标签 = 宿主机 IP（虚机指标接宿主机的关联键）
      - source_labels: [__address__]
        target_label: host_ip
      - target_label: environment
        replacement: production
      - target_label: scrape_source
        replacement: production

    metric_relabel_configs:
      # domain(10-89-132-21) → vm_ip(10.89.132.21)，与 CMDB/blackbox 虚机标签对齐
      - source_labels: [domain]
        regex: (.*)-(.*)-(.*)-(.*)
        target_label: vm_ip
        replacement: ${1}.${2}.${3}.${4}
      # 丢掉高基数标签（source_file/serial 常带唯一 ID），保留 target_device（虚机网卡名）
      - regex: (source_file|serial|source_bridge|virtual_interface|mac_address|interface_type|model_type|mtu_size|driver_name|driver_type|driver_cache|driver_discard|disk_type|target_bus)
        action: labeldrop
      # 丢掉 info/meta 信息序列（值恒为 1、只带标签，纯浪费）
      # inovex 版 meta 系列命名: libvirt_domain_info / block_stats_info / interface_stats_info / openstack_info
      - source_labels: [__name__]
        regex: libvirt_domain_(info|block_stats_info|interface_stats_info|openstack_info)
        action: drop
      # 注：libvirt 只暴露 domain XML 里挂的网卡（eth0/eth1…），不包含虚机内部的 lo，
      # 所以虚机侧无需再丢 lo，target_device 里不会出现 lo。

  # ============ 组件自监控（拨测机本机） ============
  # vmagent 顺带抓取本机的 VM 三件套自身指标，统一入库供自监控面板使用
  - job_name: self-monitoring
    static_configs:
      # VictoriaMetrics TSDB 自身指标（单机版）
      - targets:
          - 127.0.0.1:8428
        labels:
          component: victoria-metrics
          environment: production
          scrape_source: production
      # vmagent 自身指标（队列深度、抓取错误数等）
      - targets:
          - 127.0.0.1:8429
        labels:
          component: vmagent
          environment: production
          scrape_source: production
      # vmalert 自身指标（规则求值错误等）
      - targets:
          - 127.0.0.1:8880
        labels:
          component: vmalert
          environment: production
          scrape_source: production
    relabel_configs:
      # instance 显示本机真实 IP：走 loopback 抓取时 instance 默认 = 127.0.0.1:port，
      # 自监控「组件实例清单」里两台 vmagent 都是 127.0.0.1:8429 无法区分是哪台机器。
      # relabel 只改入库标签，实际抓取仍走 127.0.0.1 loopback
      - source_labels: [__address__]
        regex: '127\.0\.0\.1:(\d+)'
        target_label: instance
        replacement: "10.69.81.68:${1}"
