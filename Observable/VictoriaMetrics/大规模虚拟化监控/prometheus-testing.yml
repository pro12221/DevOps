# prometheus-testing.yml — 测试环境 vmagent 抓取配置
#
# 用途: 测试拨测机上的 vmagent 使用此配置。
#       deploy-vm.yml 按 vmagent_role 变量选择本文件(testing)或 prometheus-production.yml(production)，
#       分发到目标机的 /etc/vmagent/prometheus.yml。
#
# 与生产配置的区别:
#   1. 多了 6 个拨测 job（blackbox-icmp/tcp 各拆 bb1/bb2/bb3 三分片，ICMP/TCP 拨测全部由测试机承担）；
#      各分片 job 经 relabel 把入库 job 标签统一改回 blackbox-icmp / blackbox-tcp（分片归属看
#      probe_source=bbN），下游 vmalert 规则与 Grafana 面板按 job= 精确匹配的选择器零改动
#   2. 拨测全环境目标，3 台 blackbox 哈希分片各扛 1/3，避开踩坑 #1 单机端口耗尽；
#      分片在 vmagent relabel 侧做（hashmod），cmdb-sd.py / file_sd 文件不用改
#   3. remote_write 指向生产存储 10.69.81.68:8428（由 deploy-vm.yml 的 remote_write_url 渲染）
#
# file_sd 文件由 cmdb-sd.py（cron 每 10 分钟）生成到 /data/targets/:
#   blackbox-icmp.json   → 拨测目标（全环境虚机+宿主机，含 environment/os 等标签）
#   blackbox-tcp.json    → TCP 拨测目标
#   testing-node.json    → 测试宿主机 node_exporter 列表（:9100）
#   testing-libvirt.json → 测试宿主机 libvirt_exporter 列表（:9177）
#
# 拨测集群: bb1=10.86.11.94（与 vmagent 同机）、bb2=10.86.11.74、bb3=10.86.11.75
# （bb2/bb3 为新建虚机）

global:
  # 全局默认抓取间隔/超时，与生产配置保持一致
  scrape_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # ============ ICMP 拨测（ping，全环境虚机+宿主机，3 台 blackbox 哈希分片） ============
  # blackbox_exporter 以 /probe?target=<IP>&module=icmp 方式工作:
  # vmagent 通过 relabel 把目标 IP 塞入 __param_target，再把实际抓取地址改写为对应分片的 blackbox。
  # 分片规则：对目标 IP hashmod 3，bb1/bb2/bb3 各拨 shard 0/1/2；
  # 目标→探针是固定映射（某台探针挂了能精确知道缺哪段目标的数据），
  # file_sd 仍是全量单文件，6 个 job 共读，cmdb-sd.py 无需感知探针数量。
  # ============ ICMP bb1（shard 0） ============
  - job_name: blackbox-icmp-bb1
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [/data/targets/blackbox-icmp.json]
    relabel_configs:
      # instance 显示目标真实 IP（先于 hashmod，保证哈希对象是裸 IP）
      - source_labels: [__address__]
        target_label: instance
      # 对目标 IP 哈希取模 3，结果写入临时标签 __tmp_shard（__ 开头标签不入库）
      - source_labels: [instance]
        action: hashmod
        modulus: 3
        target_label: __tmp_shard
      # 只保留 shard=0 的目标（bb2/bb3 的 job 用 regex 1、2）
      - source_labels: [__tmp_shard]
        regex: "0"
        action: keep
      # 目标 IP 写入 __param_target，让 blackbox 知道 ping 谁
      - source_labels: [instance]
        target_label: __param_target
      # 实际抓取地址改写为 bb1 的 blackbox
      - target_label: __address__
        replacement: 10.86.11.94:9115
      # job 标签统一改回 blackbox-icmp：vmalert 的 uvmp:vm_info 锚点与 Grafana 拨测面板共 33 处
      # job="blackbox-icmp" 精确匹配选择器，job 改名会全部断查；分片归属由 probe_source=bbN 承担
      - target_label: job
        replacement: blackbox-icmp
      # 拨测来源标记，区分是哪台探针发的探测（排查探针故障按此过滤）
      - target_label: probe_source
        replacement: bb1
      # 数据来源标记
      - target_label: scrape_source
        replacement: testing

  # ============ ICMP bb2（shard 1） ============
  # relabel 链与 bb1 相同，仅 shard regex / 探针地址 / probe_source 不同
  - job_name: blackbox-icmp-bb2
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [/data/targets/blackbox-icmp.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [instance]
        action: hashmod
        modulus: 3
        target_label: __tmp_shard
      - source_labels: [__tmp_shard]
        regex: "1"
        action: keep
      - source_labels: [instance]
        target_label: __param_target
      - target_label: __address__
        replacement: 10.86.11.74:9115
      - target_label: job
        replacement: blackbox-icmp
      - target_label: probe_source
        replacement: bb2
      - target_label: scrape_source
        replacement: testing

  # ============ ICMP bb3（shard 2） ============
  - job_name: blackbox-icmp-bb3
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: [/data/targets/blackbox-icmp.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [instance]
        action: hashmod
        modulus: 3
        target_label: __tmp_shard
      - source_labels: [__tmp_shard]
        regex: "2"
        action: keep
      - source_labels: [instance]
        target_label: __param_target
      - target_label: __address__
        replacement: 10.86.11.75:9115
      - target_label: job
        replacement: blackbox-icmp
      - target_label: probe_source
        replacement: bb3
      - target_label: scrape_source
        replacement: testing

  # ============ TCP 拨测（端口连通性，3 台 blackbox 哈希分片） ============
  # 根据 os 标签决定探测端口: Linux 探 22(SSH)，Windows 探 3389(RDP)。
  # 分片规则与 ICMP 完全一致（同一目标两种协议落在同一台探针，便于按探针聚合排障）。
  # ============ TCP bb1（shard 0） ============
  - job_name: blackbox-tcp-bb1
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: [/data/targets/blackbox-tcp.json]
    relabel_configs:
      # instance 显示目标真实 IP（先于 hashmod 与端口改写）
      - source_labels: [__address__]
        target_label: instance
      # 哈希分片（同 ICMP）
      - source_labels: [instance]
        action: hashmod
        modulus: 3
        target_label: __tmp_shard
      - source_labels: [__tmp_shard]
        regex: "0"
        action: keep
      # 默认探测端口 22(SSH)
      - source_labels: [instance]
        target_label: __param_target
        replacement: ${1}:22
      # Windows 虚机改探 3389(RDP)，后写的 relabel 覆盖前写
      - source_labels: [instance, os]
        regex: (.*);windows
        target_label: __param_target
        replacement: ${1}:3389
      # 实际抓取地址改写为 bb1 的 blackbox
      - target_label: __address__
        replacement: 10.86.11.94:9115
      # job 标签统一改回 blackbox-tcp（理由同 ICMP bb1）
      - target_label: job
        replacement: blackbox-tcp
      - target_label: probe_source
        replacement: bb1
      - target_label: scrape_source
        replacement: testing

  # ============ TCP bb2（shard 1） ============
  - job_name: blackbox-tcp-bb2
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: [/data/targets/blackbox-tcp.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [instance]
        action: hashmod
        modulus: 3
        target_label: __tmp_shard
      - source_labels: [__tmp_shard]
        regex: "1"
        action: keep
      - source_labels: [instance]
        target_label: __param_target
        replacement: ${1}:22
      - source_labels: [instance, os]
        regex: (.*);windows
        target_label: __param_target
        replacement: ${1}:3389
      - target_label: __address__
        replacement: 10.86.11.74:9115
      - target_label: job
        replacement: blackbox-tcp
      - target_label: probe_source
        replacement: bb2
      - target_label: scrape_source
        replacement: testing

  # ============ TCP bb3（shard 2） ============
  - job_name: blackbox-tcp-bb3
    metrics_path: /probe
    params:
      module: [tcp_connect]
    file_sd_configs:
      - files: [/data/targets/blackbox-tcp.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [instance]
        action: hashmod
        modulus: 3
        target_label: __tmp_shard
      - source_labels: [__tmp_shard]
        regex: "2"
        action: keep
      - source_labels: [instance]
        target_label: __param_target
        replacement: ${1}:22
      - source_labels: [instance, os]
        regex: (.*);windows
        target_label: __param_target
        replacement: ${1}:3389
      - target_label: __address__
        replacement: 10.86.11.75:9115
      - target_label: job
        replacement: blackbox-tcp
      - target_label: probe_source
        replacement: bb3
      - target_label: scrape_source
        replacement: testing

  # ============ 测试宿主机 node_exporter ============
  # targets 为宿主机 IP，instance 显示宿主机真实 IP 而不是 IP:9100
  - job_name: node-exporter
    file_sd_configs:
      - files: [/data/targets/testing-node.json]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      # file_sd 是裸 IP，补上 node_exporter 端口（此前漏了这步，实际抓的一直是 80 端口，
      # up 全 0、宿主机资源面板无数据；regex 缺省 (.*)，${1} 即整个 IP）
      - source_labels: [__address__]
        target_label: __address__
        replacement: ${1}:9100
      # 打上环境标签，Grafana 按环境区分；scrape_source 标记数据由哪台 vmagent 采集
      - target_label: environment
        replacement: testing
      - target_label: scrape_source
        replacement: testing

  # ============ 测试宿主机 libvirt_exporter（虚机指标） ============
  # file_sd 目标是宿主机 IP，改写端口为 :9177；host_ip 标签保留宿主机 IP，
  # 让虚机指标既能按虚机(vm_ip/domain)也能按宿主机(host_ip)聚合
  - job_name: libvirt-vm
    file_sd_configs:
      - files: [/data/targets/testing-libvirt.json]
    relabel_configs:
      # host_ip 标签 = 宿主机 IP（虚机指标↔宿主机的关联键）
      - source_labels: [__address__]
        target_label: host_ip
      # 实际抓取地址 = 宿主机 IP + :9177（libvirt_exporter 端口）
      - source_labels: [__address__]
        target_label: __address__
        replacement: ${1}:9177
      - target_label: environment
        replacement: testing
      - target_label: scrape_source
        replacement: testing

  # ============ 组件自监控（vmagent + blackbox 探针） ============
  # 测试机 vmagent 顺带抓取各组件自身指标，统一入库供自监控面板使用；
  # 覆盖本机 vmagent、bb1 本机 blackbox、bb2/bb3 两台远端 blackbox
  - job_name: self-monitoring
    static_configs:
      # vmagent 自身指标（队列深度、抓取错误数等）
      - targets:
          - 127.0.0.1:8429
        labels:
          component: vmagent
          environment: testing
          scrape_source: testing
      # blackbox_exporter 自身指标（探针并发、失败数等）；bb1 与 vmagent 同机走 127.0.0.1
      - targets:
          - 127.0.0.1:9115
        labels:
          component: blackbox-exporter
          environment: testing
          scrape_source: testing
      # bb2/bb3 远端 blackbox_exporter 自身指标
      - targets:
          - 10.86.11.74:9115
          - 10.86.11.75:9115
        labels:
          component: blackbox-exporter
          environment: testing
          scrape_source: testing
